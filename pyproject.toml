[project]
name = "ai-news-reporter"
version = "0.1.0"
description = "AIニュース自動収集・レポート生成システム"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "feedparser>=6.0.10",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dateutil>=2.8.2",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.3",
    "requests-ratelimiter>=0.4.2",
    "textstat>=0.7.3",
    "jinja2>=3.1.2",
    "schedule>=1.2.0",
    "yfinance>=0.2.18",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]